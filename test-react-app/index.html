<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iris Layout</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" id="iris-css" />
  <script>document.getElementById('iris-css').href = './dist/styles.css?v=' + Date.now()</script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19",
      "react-dom": "https://esm.sh/react-dom@19",
      "react-dom/client": "https://esm.sh/react-dom@19/client",
      "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100dvh;
      background: #1a1a2e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    .main-area {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }
    .entity-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState, createElement as h } from 'react'
    import { createRoot } from 'react-dom/client'
    import { IrisLayout } from './dist/iris-layout.js'

    const icon = (cls) => () => h('i', {className: cls})

    const ENTITIES = {
      editor: { id: 'editor', name: 'editor.cljs', type: 'code', color: '#6366f1', icon: icon('fa-solid fa-code') },
      terminal: { id: 'terminal', name: 'Terminal', type: 'terminal', color: '#10b981', icon: icon('fa-solid fa-terminal') },
      browser: { id: 'browser', name: 'Preview', type: 'browser', color: '#f59e0b', icon: icon('fa-solid fa-globe') },
      notes: { id: 'notes', name: 'Notes', type: 'notes', color: '#ec4899', icon: icon('fa-solid fa-note-sticky') },
      repl: { id: 'repl', name: 'REPL', type: 'repl', color: '#8b5cf6', icon: icon('fa-solid fa-chevron-right') },
    }

    const INITIAL_WORKSPACES = {
      'ws-1': { x: 0, y: 0, layout: {
        type: 'split', id: 's1', direction: 'horizontal', ratio: 0.6,
        children: [
          { type: 'tile', id: 't1', 'entity-id': 'editor' },
          { type: 'split', id: 's2', direction: 'vertical', ratio: 0.6,
            children: [
              { type: 'tile', id: 't2', 'entity-id': 'terminal' },
              { type: 'tile', id: 't3', 'entity-id': 'repl' },
            ]
          }
        ]
      }},
      'ws-2': { x: 1, y: 0, layout: {
        type: 'split', id: 's3', direction: 'horizontal', ratio: 0.5,
        children: [
          { type: 'tile', id: 't4', 'entity-id': 'editor' },
          { type: 'tile', id: 't5', 'entity-id': 'browser' },
        ]
      }},
      'ws-3': { x: 0, y: 1, layout: { type: 'tile', id: 't6', 'entity-id': 'notes' } },
      'ws-4': { x: 1, y: 1, layout: {
        type: 'split', id: 's4', direction: 'vertical', ratio: 0.5,
        children: [
          { type: 'tile', id: 't7', 'entity-id': 'terminal' },
          { type: 'tile', id: 't8', 'entity-id': 'repl' },
        ]
      }}
    }

    function EntityTile(props) {
      const entity = ENTITIES[props.id] || props
      return h('div', {className:'entity-tile'}, entity.name)
    }

    function App() {
      const [workspaces, setWorkspaces] = useState(INITIAL_WORKSPACES)
      const [activePosition, setActivePosition] = useState([0, 0])
      const [activeEntity, setActiveEntity] = useState(null)
      const [entities, setEntities] = useState(ENTITIES)

      return h('div', {className:'app'},
        h('div', {className:'main-area'},
          h(IrisLayout, {
            workspaces,
            activePosition,
            activeEntity,
            entities,
            renderEntityTile: EntityTile,
            onWorkspacesChange: setWorkspaces,
            onActivePositionChange: setActivePosition,
            onActiveEntityChange: setActiveEntity,
            onEntityColorChange: (entityId, color) => {
              setEntities(prev => ({...prev, [entityId]: {...prev[entityId], color}}))
            },
            logo: h('i', {className: 'fa-solid fa-eye'}),
          })
        )
      )
    }

    createRoot(document.getElementById('root')).render(h(App))
  </script>
</body>
</html>
